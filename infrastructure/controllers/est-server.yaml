---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: est-server
  namespace: est
spec:
  interval: 1h
  chart:
    spec:
      chart: ./deploy/helm/est-server
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: est-server
  values:
    image:
      repository: ghcr.io/th3link/est-server
      tag: "0.1.0"
    service:
      type: LoadBalancer
      ipFamilyPolicy: RequireDualStack
      annotations:
        metallb.universe.tf/loadBalancerIPs: "192.168.178.225,fd00::225"
    serverCertificate:
      dnsNames:
        - est.luehr.dev
      issuerRef:
        name: letsencrypt-dns
        kind: ClusterIssuer
    # Client certificates come from Let's Encrypt, no own CA needed
    bootstrapCA:
      enabled: false
    caSecret: est-server-letsencrypt-ca
    config: |
      [server]
      listen = ["[::]:8443"]
      health_listen = ["[::]:8080"]
      state_dir = "/var/lib/est-server"

      [server.tls]
      cert = "/etc/est-server/tls/tls.crt"
      key = "/etc/est-server/tls/tls.key"

      # /.well-known/est: names under home.luehr.dev get a Let's Encrypt
      # certificate (DNS-01 takes longer than wait, clients get 202 first)
      [[label]]
      signer = { type = "cert-manager", issuer = { name = "letsencrypt-dns", kind = "ClusterIssuer" }, cacerts = "/etc/est-server/ca/ca.crt", duration = "2160h", wait = "20s" }
      allow = ["*.home.luehr.dev"]
      identity_cas = []
      manual_approval = false
      retry_after = "2m"
