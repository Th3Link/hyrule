---
# Longhorn backups go to the NAS (NFS export /backup on 192.168.178.239).
# Volumes join the daily backup through the group label
#   recurring-job-group.longhorn.io/backup: enabled
# (on the PVC together with recurring-job.longhorn.io/source: enabled, or
# directly on the Longhorn volume). See docs/backup-restore.md.
apiVersion: longhorn.io/v1beta2
kind: BackupTarget
metadata:
  name: default
  namespace: longhorn
spec:
  backupTargetURL: nfs://192.168.178.239:/backup
  credentialSecret: ""
  pollInterval: 5m0s
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-backup
  namespace: longhorn
spec:
  task: backup
  # Longhorn cron is UTC: 02:00 UTC = 03:00/04:00 Berlin, after the dump jobs (02:00)
  cron: "0 2 * * *"
  groups:
    - backup
  retain: 14
  concurrency: 2
---
# VM root disks (vms/): give space freed in the guest back to Longhorn.
# Volumes join with the label recurring-job-group.longhorn.io/vm=enabled.
# 1. snapshot-cleanup removes system snapshots (e.g. from replica rebuilds).
#    The one under volume-head is only marked removed ...
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: vm-snapshot-cleanup
  namespace: longhorn
spec:
  task: snapshot-cleanup
  cron: "0 1 * * *"
  groups:
    - vm
  retain: 0
  concurrency: 1
---
# 2. ... and filesystem-trim frees its data too, because the VM volumes have
#    unmapMarkSnapChainRemoved=enabled. Needs discard inside the guest (btrfs
#    discard=async) and discard='unmap' on the KubeVirt disk.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: vm-filesystem-trim
  namespace: longhorn
spec:
  task: filesystem-trim
  cron: "30 1 * * *"
  groups:
    - vm
  retain: 0
  concurrency: 1
