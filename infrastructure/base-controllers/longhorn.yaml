---
apiVersion: v1
kind: Namespace
metadata:
  name: longhorn
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: longhorn-repo
  namespace: longhorn
spec:
  interval: 1h
  url: https://charts.longhorn.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn
spec:
  chart:
    spec:
      chart: longhorn
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: longhorn-repo
      version: 1.13.0
  interval: 1m0s
  timeout: 15m
  values:
    defaultSettings:
      # Upgrade volume engines automatically after a Longhorn upgrade
      # (needed before the next minor upgrade)
      concurrentAutomaticEngineUpgradePerNodeLimit: 1
      # Back up volumes that are only attached while a job runs (db-dumps)
      allowRecurringJobWhileVolumeDetached: true
