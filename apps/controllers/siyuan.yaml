apiVersion: v1
kind: Namespace
metadata:
  name: siyuan
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: siyuan-workspace
  namespace: siyuan
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-retain
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: siyuan
  namespace: siyuan
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: siyuan
  template:
    metadata:
      labels:
        app: siyuan
    spec:
      containers:
        - name: siyuan
          image: b3log/siyuan:latest
          # No dropped capabilities: the entrypoint script chowns the
          # workspace dir to PUID:PGID on first start, similar to postgres.
          args: ["serve", "--workspace=/siyuan/workspace/"]
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Berlin
            - name: SIYUAN_ACCESS_AUTH_CODE
              valueFrom:
                secretKeyRef:
                  name: siyuan-secrets
                  key: ACCESS_AUTH_CODE
          ports:
            - containerPort: 6806
          readinessProbe:
            tcpSocket:
              port: 6806
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 6806
            periodSeconds: 15
          volumeMounts:
            - name: workspace
              mountPath: /siyuan/workspace
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: siyuan-workspace
---
apiVersion: v1
kind: Service
metadata:
  name: siyuan
  namespace: siyuan
spec:
  selector:
    app: siyuan
  ports:
    - port: 6806
      targetPort: 6806
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: siyuan
  namespace: siyuan
spec:
  rules:
    - host: notes.luehr.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: siyuan
                port:
                  number: 6806
