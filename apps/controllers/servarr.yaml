apiVersion: v1
kind: Namespace
metadata:
    name: servarr
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
    name: servarr
    namespace: servarr
spec:
    interval: 1h
    url: https://charts.kubito.dev
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: servarr
    namespace: servarr
spec:
    chart:
        spec:
            chart: servarr
            reconcileStrategy: ChartVersion
            sourceRef:
                kind: HelmRepository
                name: servarr
            version: 1.5.2
    interval: 1m0s
    timeout: 15m
    values:
      qbittorrent:
        enabled: false
      jellyfin:
        image:
          tag: "12.0ubu2604-ls48"
        ingress:
          enabled: true
          hosts: ["jellyfin.luehr.dev"]
        nodeSelector:
          performance: fast
        persistence:
          config:
            storageClass: longhorn-retain
            size: 5Gi
          media:
            enabled: true
            accessMode: ReadWriteMany
            existingClaim: servarr-jellyfin-media
          extraExistingClaimMounts:
            - name: servarr-jellyfin-downloads
              mountPath: /downloads
              readOnly: false
              existingClaim: servarr-jellyfin-downloads
      sonarr:
        image:
          tag: "4.0.19.2979-ls322"
        ingress:
          enabled: true
          className: traefik-internal
          hosts:
            - host: sonarr.luehr.dev
              paths:
                - path: /
                  pathType: Prefix
        persistence:
          storageClass: longhorn-retain
          additionalVolumes:
            - name: sonarr-downloads
              persistentVolumeClaim:
                claimName: servarr-jellyfin-downloads
          additionalMounts:
            - name: sonarr-downloads
              mountPath: /downloads
              readOnly: false
      prowlarr:
        image:
          tag: "2.5.2.5491-ls159"
        ingress:
          enabled: true
          className: traefik-internal
          hosts:
            - host: prowlarr.luehr.dev
              paths:
                - path: /
                  pathType: Prefix
        persistence:
          storageClass: longhorn-retain
      flaresolverr:
        image:
          tag: "v3.5.0"
        ingress:
          enabled: true
          className: traefik-internal
          hosts:
            - host: flaresolverr.luehr.dev
              paths:
                - path: /
                  pathType: Prefix
        persistence:
          storageClass: longhorn-retain
      seerr:
        image:
          tag: "v3.4.1"
        podSecurityContext:
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        ingress:
          enabled: true
          className: traefik-internal
          hosts:
            - host: jellyseerr.luehr.dev
              paths:
                - path: /
                  pathType: Prefix
        persistence:
          storageClass: longhorn-retain
      bazarr:
        image:
          tag: "v1.6.1-ls364"
        ingress:
          enabled: true
          className: traefik-internal
          hosts:
            - host: bazarr.luehr.dev
              paths:
                - path: /
                  pathType: Prefix
        persistence:
          storageClass: longhorn-retain
      radarr:
        image:
          tag: "6.3.0.10514-ls316"
        ingress:
          enabled: true
          className: traefik-internal
          hosts:
            - host: radarr.luehr.dev
              paths:
                - path: /
                  pathType: Prefix
        persistence:
          storageClass: longhorn-retain
          additionalVolumes:
            - name: radarr-downloads
              persistentVolumeClaim:
                claimName: servarr-jellyfin-downloads
          additionalMounts:
            - name: radarr-downloads
              mountPath: /downloads
              readOnly: false
      lidarr:
        image:
          tag: "3.1.0.4875-ls40"
        ingress:
          enabled: true
          className: traefik-internal
          hosts:
            - host: lidarr.luehr.dev
              paths:
                - path: /
                  pathType: Prefix
        persistence:
          storageClass: longhorn-retain
          size: 5Gi
          additionalVolumes:
            - name: lidarr-downloads
              persistentVolumeClaim:
                claimName: servarr-jellyfin-downloads
          additionalMounts:
            - name: lidarr-downloads
              mountPath: /downloads
              readOnly: false
