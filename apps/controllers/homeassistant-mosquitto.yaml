apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: homeassistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      securityContext:
        runAsUser: 1883
        runAsGroup: 1883
        fsGroup: 1883
      initContainers:
        - name: copy-mosquitto
          image: ubuntu
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsUser: 1883
            runAsGroup: 1883
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          command:
            - sh
            - -c
            - |
              mkdir -p /mosquitto/certs /mosquitto/config
              cp --no-preserve=ownership -L /certs/tls.crt /certs/tls.key /mosquitto/certs/
              chmod 0600 /mosquitto/certs/tls.key
              cp /mosquitto.conf /mosquitto/config
              cp /passwd /mosquitto/config
              cp /acl /mosquitto/config
              chmod 0700 /mosquitto/config/passwd
              chmod 0700 /mosquitto/config/acl
              ls -la /mosquitto
              ls -la /mosquitto/certs
              ls -la /mosquitto/config
          volumeMounts:
            - name: certs
              mountPath: /certs
            - name: config
              mountPath: /mosquitto.conf
              subPath: mosquitto.conf
            - name: secrets
              mountPath: /passwd
              subPath: passwd
            - name: secrets
              mountPath: /acl
              subPath: acl
            - name: mosquitto
              mountPath: /mosquitto
      containers:
        - name: mosquitto
          image: eclipse-mosquitto
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsUser: 1883
            runAsGroup: 1883
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          ports:
            - containerPort: 8883
          volumeMounts:
            - name: mosquitto
              mountPath: /mosquitto
      volumes:
        - name: config
          configMap:
            name: mosquitto-config
        - name: secrets
          secret:
            secretName: mosquitto-password
        - name: certs
          secret:
            # Let's Encrypt certificate from cert-manager (see Certificate below)
            secretName: mosquitto-tls
        - name: mosquitto
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: homeassistant
data:
  mosquitto.conf: |
    allow_anonymous false
    password_file /mosquitto/config/passwd
    acl_file /mosquitto/config/acl
    
    listener 8883
    protocol mqtt
    
    # Let's Encrypt certificate (cert-manager); tls.crt contains the full chain.
    # No cafile: clients are not asked for certificates.
    certfile /mosquitto/certs/tls.crt
    keyfile /mosquitto/certs/tls.key
    require_certificate false
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: homeassistant
  annotations:
    metallb.universe.tf/loadBalancerIPs: "192.168.178.213,fd00::213"
spec:
  selector:
    app: mosquitto
  type: LoadBalancer
  ports:
    - name: mqtts
      port: 8883
      targetPort: 8883
      protocol: TCP
  ipFamilyPolicy: RequireDualStack
  ipFamilies:
    - IPv4
    - IPv6
---
# Publicly trusted certificate for MQTT over TLS (DNS-01 via Cloudflare)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mosquitto-tls
  namespace: homeassistant
spec:
  secretName: mosquitto-tls
  renewBefore: 720h
  dnsNames:
    - mosquitto.luehr.dev
    - mqtt.luehr.dev
  issuerRef:
    name: letsencrypt-dns
    kind: ClusterIssuer
---
# Mosquitto reads the certificate only at start (the init container copies it).
# Restart it weekly so a renewed certificate (renewed 30 days before expiry)
# is picked up well in time.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mosquitto-restart
  namespace: homeassistant
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mosquitto-restart
  namespace: homeassistant
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["mosquitto"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mosquitto-restart
  namespace: homeassistant
subjects:
  - kind: ServiceAccount
    name: mosquitto-restart
    namespace: homeassistant
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mosquitto-restart
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mosquitto-restart
  namespace: homeassistant
spec:
  schedule: "30 4 * * 1"
  timeZone: Europe/Berlin
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: mosquitto-restart
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: kubectl
              image: registry.k8s.io/kubectl:v1.37.2
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              args: ["-n", "homeassistant", "rollout", "restart", "deployment/mosquitto"]
