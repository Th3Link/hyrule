---
# Nextcloud runs on SQLite (data/nextcloud.db), the MariaDB of the chart is
# unused. This job copies the SQLite DB (VACUUM INTO = consistent snapshot while
# Nextcloud runs) and the config dir (config.php holds instanceid, passwordsalt,
# secret) into the db-dumps PVC, which Longhorn backs up to S3 (group "backup").
# Restore: see docs/backup-restore.md
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-dumps
  namespace: nextcloud
  labels:
    recurring-job-group.longhorn.io/backup: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextcloud-backup
  namespace: nextcloud
spec:
  schedule: "0 2 * * *"
  timeZone: Europe/Berlin
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          # The 600Gi volume is RWO: run next to Nextcloud and mount only the
          # needed subPaths. No fsGroup: it would chown the whole volume.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: nextcloud
                      app.kubernetes.io/component: app
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsUser: 33          # www-data, owns the Nextcloud files
            runAsGroup: 33
            supplementalGroups: [1001]  # group of the db-dumps PVC
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: docker.io/library/nextcloud:34.0.3-apache
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  ts=$(date +%Y%m%d-%H%M%S)
                  php -r '
                    $db = new SQLite3("/nc/data/nextcloud.db", SQLITE3_OPEN_READONLY);
                    $db->busyTimeout(60000);
                    if (!$db->exec("VACUUM INTO \x27/tmp/nextcloud.db\x27")) { fwrite(STDERR, $db->lastErrorMsg()."\n"); exit(1); }
                    $chk = new SQLite3("/tmp/nextcloud.db", SQLITE3_OPEN_READONLY);
                    $r = $chk->querySingle("PRAGMA integrity_check");
                    if ($r !== "ok") { fwrite(STDERR, "integrity_check: $r\n"); exit(1); }
                  '
                  gzip -c /tmp/nextcloud.db > /dumps/nextcloud-db-$ts.sqlite.gz.tmp
                  mv /dumps/nextcloud-db-$ts.sqlite.gz.tmp /dumps/nextcloud-db-$ts.sqlite.gz
                  tar -czf /dumps/nextcloud-config-$ts.tar.gz.tmp -C /nc config
                  mv /dumps/nextcloud-config-$ts.tar.gz.tmp /dumps/nextcloud-config-$ts.tar.gz
                  find /dumps -name 'nextcloud-*' -mtime +14 -delete
                  ls -lh /dumps
              volumeMounts:
                - name: nextcloud
                  mountPath: /nc/data/nextcloud.db
                  subPath: data/nextcloud.db
                  readOnly: true
                - name: nextcloud
                  mountPath: /nc/config
                  subPath: config
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                - name: dumps
                  mountPath: /dumps
          volumes:
            - name: nextcloud
              persistentVolumeClaim:
                claimName: nextcloud-nextcloud
            - name: tmp
              emptyDir: {}
            - name: dumps
              persistentVolumeClaim:
                claimName: db-dumps
