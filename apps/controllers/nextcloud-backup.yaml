---
# Nextcloud runs on PostgreSQL (nextcloud-postgres.yaml). This job writes a
# pg_dump (custom format) and a tar of the config dir (config.php holds
# instanceid, passwordsalt, secret) into the db-dumps PVC, which Longhorn backs
# up to the NAS (group "backup").
# Restore: see docs/backup-restore.md
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-dumps
  namespace: nextcloud
  labels:
    # Longhorn copies the recurring-job labels of the PVC to the volume
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/backup: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextcloud-backup
  namespace: nextcloud
spec:
  schedule: "0 2 * * *"
  timeZone: Europe/Berlin
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          # The 600Gi volume is RWO: run next to Nextcloud and mount only the
          # config subPath. No fsGroup: it would chown the whole volume.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: nextcloud
                      app.kubernetes.io/component: app
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsUser: 33          # www-data, owns the Nextcloud files
            runAsGroup: 33
            supplementalGroups: [1001]  # group of the db-dumps PVC
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: pg-dump
              # same major version as the server (Renovate bumps both)
              image: postgres:18.6
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              env:
                - name: PGHOST
                  value: nextcloud-postgres
                - name: PGUSER
                  value: nextcloud
                - name: PGDATABASE
                  value: nextcloud
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: nextcloud-postgres
                      key: POSTGRES_PASSWORD
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  f=/dumps/nextcloud-pg-$(date +%Y%m%d-%H%M%S).dump
                  pg_dump --format=custom --file="$f.tmp"
                  pg_restore --list "$f.tmp" > /dev/null   # readable archive?
                  mv "$f.tmp" "$f"
              volumeMounts:
                - name: dumps
                  mountPath: /dumps
          containers:
            - name: config
              image: docker.io/library/nextcloud:35.0.2-apache
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  f=/dumps/nextcloud-config-$(date +%Y%m%d-%H%M%S).tar.gz
                  tar -czf "$f.tmp" -C /nc config
                  mv "$f.tmp" "$f"
                  find /dumps -name 'nextcloud-*' -mtime +14 -delete
                  ls -lh /dumps
              volumeMounts:
                - name: nextcloud
                  mountPath: /nc/config
                  subPath: config
                  readOnly: true
                - name: dumps
                  mountPath: /dumps
          volumes:
            - name: nextcloud
              persistentVolumeClaim:
                claimName: nextcloud-nextcloud
            - name: dumps
              persistentVolumeClaim:
                claimName: db-dumps
