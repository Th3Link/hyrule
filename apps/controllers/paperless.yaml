apiVersion: v1
kind: Namespace
metadata:
  name: paperless
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: paperless
  namespace: paperless
spec:
  interval: 1h
  url: oci://ghcr.io/gabe565/charts/paperless-ngx
  ref:
    # Keep the recovery on the currently deployed chart version.
    tag: 0.24.1
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless
  namespace: paperless
spec:
  chartRef:
    kind: OCIRepository
    name: paperless
    namespace: paperless
  interval: 1m0s
  timeout: 15m
  values:
    replicaCount: 1
    image:
      tag: 2.18.4
    ingress:
      main:
        enabled: true
        hosts:
          - host: paperless.luehr.dev
            paths:
              - path: /
    mariadb:
      enabled: true
      # Temporary recovery: same image version and data layout, archived registry.
      image:
        repository: bitnamilegacy/mariadb
        tag: 11.4.4-debian-12-r0
      auth:
        database: paperless
        username: paperless
        existingSecret: paperless-db
      primary:
        persistence:
          enabled: true
          storageClass: longhorn
    redis:
      global:
        security:
          # The bundled chart only recognizes the old bitnami repository name.
          allowInsecureImages: true
      image:
        repository: bitnamilegacy/redis
        tag: 7.4.3-debian-12-r0
    env:
      TZ: Europe/Berlin
      PAPERLESS_URL: https://paperless.luehr.dev
      PAPERLESS_OCR_LANGUAGE: deu
      PAPERLESS_FILENAME_FORMAT: '{{"{{"}} created {{"}}"}}_{{"{{"}} title {{"}}"}}_{{"{{"}} correspondent {{"}}"}}'
      PAPERLESS_CONSUMPTION_DIR: /usr/src/paperless/consume
      PAPERLESS_EXPORT_DIR: /usr/src/paperless/export
    persistence:
      data:
        enabled: true
        retain: true
        mountPath: /usr/src/paperless/data
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 1Gi
      media:
        enabled: true
        retain: true
        mountPath: /usr/src/paperless/media
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 8Gi
      export:
        enabled: true
        retain: true
        mountPath: /usr/src/paperless/export
        storageClass: longhorn
        accessMode: ReadWriteMany
        size: 1Gi
      consume:
        enabled: true
        retain: true
        mountPath: /usr/src/paperless/consume
        storageClass: longhorn
        accessMode: ReadWriteMany
        size: 1Gi
