apiVersion: v1
kind: Namespace
metadata:
    name: nextcloud
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
    name: nextcloud
    namespace: nextcloud
spec:
    interval: 1h
    url: https://nextcloud.github.io/helm/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: nextcloud
    namespace: nextcloud
spec:
    chart:
        spec:
            chart: nextcloud
            reconcileStrategy: ChartVersion
            sourceRef:
                kind: HelmRepository
                name: nextcloud
            version: 9.4.3
    interval: 1m0s
    timeout: 45m
    upgrade:
        remediation:
            retries: 3
    values:
        global:
            security:
                allowInsecureImages: true
        image:
            # renovate: image=docker.io/library/nextcloud
            tag: "35.0.2-apache"
        replicaCount: 1
        # Background jobs: crond sidecar runs cron.php every 5 minutes
        # (Nextcloud background mode set to "cron" with occ background:cron)
        cronjob:
            enabled: true
        nextcloud:
            host: nextcloud.luehr.dev
            existingSecret:
                enabled: true
                secretName: nextcloud-admin
                usernameKey: username
                passwordKey: password
        ingress:
            enabled: true
        phpClientHttpsFix:
            enabled: true
            protocol: https
        internalDatabase:
            enabled: false
        # PostgreSQL 18, see nextcloud-postgres.yaml (migrated from SQLite)
        externalDatabase:
            enabled: true
            type: postgresql
            host: nextcloud-postgres
            existingSecret:
                enabled: true
                secretName: nextcloud-postgres
                usernameKey: username
                passwordKey: POSTGRES_PASSWORD
                databaseKey: database
        mariadb:
            enabled: false
        persistence:
            enabled: true
            storageClass: longhorn
            size: 600Gi
