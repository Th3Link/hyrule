apiVersion: v1
kind: Namespace
metadata:
    name: nextcloud
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
    name: nextcloud
    namespace: nextcloud
spec:
    interval: 1h
    url: https://nextcloud.github.io/helm/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: nextcloud
    namespace: nextcloud
spec:
    chart:
        spec:
            chart: nextcloud
            reconcileStrategy: ChartVersion
            sourceRef:
                kind: HelmRepository
                name: nextcloud
            version: 9.2.6
    interval: 1m0s
    timeout: 45m
    upgrade:
        remediation:
            retries: 3
    values:
        global:
            security:
                allowInsecureImages: true
        replicaCount: 1
        nextcloud:
            host: nextcloud.luehr.dev
            existingSecret:
                enabled: true
                secretName: nextcloud-admin
                usernameKey: username
                passwordKey: password
        ingress:
            enabled: true
        phpClientHttpsFix:
            enabled: true
            protocol: https
        internalDatabase:
            enabled: false
        externalDatabase:
            enabled: true
            type: mysql
            host: nextcloud-mariadb
            existingSecret:
                enabled: true
                secretName: nextcloud-db
                usernameKey: username
                passwordKey: mariadb-password
                databaseKey: database
        mariadb:
            enabled: true
            image:
                registry: docker.io
                repository: bitnamilegacy/mariadb
                tag: 11.4.6-debian-12-r0
            auth:
                database: nextcloud
                username: nextcloud
                existingSecret: nextcloud-db
            primary:
                persistence:
                    enabled: true
                    storageClass: longhorn
                    size: 8Gi
        persistence:
            enabled: true
            storageClass: longhorn
            size: 600Gi
