    controlPlane:
        endpoint: https://[fd00::230]:6443 # Endpoint represents the endpoint URL parsed out of the machine config.
    clusterName: hyrule
    network:
        cni:
            name: flannel
        dnsDomain: hyrule.luehr.dev
        podSubnets:
            - 10.244.0.0/16
            - fd01:10:244::/48
        serviceSubnets:
            - 10.96.0.0/12
            - fd01:10:96::/112
    token: ENC[AES256_GCM,data:K4mnZKKwPEuM8e8np2Ha/Rl/T9YHvoQ=,iv:vycF6vOndUu2LhdEiKR6i1lM6uNkFU18pw9tzybdpL4=,tag:kryMAzaEy4ou5PVj6zVizg==,type:str] # The [bootstrap token](https://kubernetes.io/docs/reference/access-authn-authz/bootstrap-tokens/) used to join the cluster.
    secretboxEncryptionSecret: ENC[AES256_GCM,data:qr0lfscWZ15kYzZJGFH87tZrUKgR+ffkJG9EgwCQmvbHbcbffKm/Sq4UJWk=,iv:ig1Ix5TrK37Q7ADg7ufwbKDjEtqu3ZlJotKEDnHr6Jo=,tag:soH4yB646A9rV2rnYMYcrg==,type:str]
    ca:
        crt: 
        key: ENC[AES256_GCM,data:,iv:yxOULWblDXMT/SRZiar47egdth2ax7bHtzTmML8axww=,tag:SoVBZtYFf0NdxD2RwASzVg==,type:str]
    aggregatorCA:
        crt: 
        key: ENC[AES256_GCM,data:,iv:cPEPfNI07Sw8h3rlQa6KWQAl0a274K/4ONo+3QpmILc=,tag:IuvPmfMmmptOc8i1OuIfHg==,type:str]
    serviceAccount:
        key: ENC[AES256_GCM,data:,iv:kmBUEZvtEqVnQbIByUDCi+jBC1W5aoiD71uLnIAwAV8=,tag:gWX/8fd4Ajwf3HHBNYpICg==,type:str]
    apiServer:
        image: registry.k8s.io/kube-apiserver:v1.37.2
        certSANs:
            - 192.168.178.230
            - fd00::230
        disablePodSecurityPolicy: true
        admissionControl:
            - name: PodSecurity
              configuration:
                apiVersion: pod-security.admission.config.k8s.io/v1alpha1
                defaults:
                    audit: restricted
                    audit-version: latest
                    enforce: baseline
                    enforce-version: latest
                    warn: restricted
                    warn-version: latest
                exemptions:
                    namespaces:
                        - kube-system
                    runtimeClasses: []
                    usernames: []
                kind: PodSecurityConfiguration
        auditPolicy:
            apiVersion: audit.k8s.io/v1
            kind: Policy
            rules:
                - level: Metadata
    controllerManager:
        image: registry.k8s.io/kube-controller-manager:v1.37.2
    proxy:
        image: registry.k8s.io/kube-proxy:v1.37.2
        extraArgs:
            cluster-cidr: 10.244.0.0/16,fd00:10:244::/48
    scheduler:
        image: registry.k8s.io/kube-scheduler:v1.37.2
    discovery:
        enabled: true
        registries:
            kubernetes:
                disabled: true
            service: {}
    # Etcd specific configuration options.
    etcd:
        # The `ca` is the root certificate authority of the PKI.
        ca:
            crt: 
            key: ENC[AES256_GCM,data:,iv:kfS1aq9D7TkFcpwZo22gdK4CjUzo9T7zM6UaxT4k05A=,tag:GdS1ajkcRHs41YxLw43Qag==,type:str]
