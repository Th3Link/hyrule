    clusterName: hyrule
    network:
        cni:
            name: flannel
        dnsDomain: hyrule.luehr.dev
        podSubnets:
            - 10.244.0.0/16
            - fd01:10:244::/48
        serviceSubnets:
            - 10.96.0.0/12
            - fd01:10:96::/112
    token: ENC[AES256_GCM,data:3LjgJtseNvYpppDwuP8BW6qYIlGSLN0=,iv:5lFeZpZn2KwtJCd8J4iPjSZty1zF2H7WmCNK5qZn18U=,tag:VX9AD+V5x2qq6vYNak7aVw==,type:str] # The [bootstrap token](https://kubernetes.io/docs/reference/access-authn-authz/bootstrap-tokens/) used to join the cluster.
    secretboxEncryptionSecret: ENC[AES256_GCM,data:J5D9rQHcVX0bFnnWrUhwSLSpaChDVTWyvkR2k9WiDqqbVQAddid/kEchcns=,iv:Uxeyad+uhqP2Ji/vJmVuUvkWpIk7qdRj/ce9QwaF6Y0=,tag:nvX6yQa8yVgystgLn21GTA==,type:str]
    ca:
