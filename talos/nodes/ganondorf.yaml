version: v1alpha1 # Indicates the schema used to decode the contents.
debug: false # Enable verbose logging to the console.
persist: true
# Provides machine specific configuration options.
machine:
    type: controlplane # Defines the role of the machine within the cluster.
    token: ENC[AES256_GCM,data:b1oJm+2pv4mVteK8i+TmBkyOYxZOVSo=,iv:1AKS4oAQ/XD9fCakEpWZMmE6Bz7dPAX+/BBdXwh2Np8=,tag:MbgWAvCveS3R+aygEESaQA==,type:str] # The `token` is used by a machine to join the PKI of the cluster.
    # The root certificate authority of the PKI.
    ca:
        crt: 
        key: ENC[AES256_GCM,data:R1sWZHt2P5FEZKxX1iD4UU1zbiGPncZ3MamV23ecvQoGhChOvva1+iFGe5IX0Wu6C+cUaRrjLyFghYjuVsjdgorOsYELjn4Qx000m8J9h1pdMIkmzMRwQ/eeZ9Hq+Z1j3MP4dLw6nsciG6Lh5LVIkddhLbNnRQ0XBgZBFvggXl73EatvQLi6IPY+LyHqQ8dqK+sMya4/wtSPxiz+WFUyk1X/aanQ4c+kEWiMFVw76dE8ZxuV,iv:5LnZqB8Bk33lWTsFHpWXP3IylOnIGVwi7rN5tQdwdZo=,tag:K/HiF1EdKD07NtHDWpQZ3Q==,type:str]
    # Extra certificate subject alternative names for the machine's certificate.
    certSANs: []
    #   # Uncomment this to enable SANs.
    #   - 10.0.0.10
    #   - 172.16.0.10
    #   - 192.168.0.10
    kubelet:
        image: ghcr.io/siderolabs/kubelet:v1.37.2
        defaultRuntimeSeccompProfileEnabled: true
        disableManifestsDirectory: true
    network:
        hostname: ganondorf
        interfaces:
            - deviceSelector:
                hardwareAddr: 38:f7:cd:ce:05:22
              addresses:
                - 192.168.178.235/24
                - fd00::235/64
              routes:
                - network: 0.0.0.0/0
                  gateway: 192.168.178.1
                - network: ::/0
                  gateway: fd00::cece:1eff:fe8c:1973
              dhcp: false
              vip:
                ip: fd00::230
        nameservers:
            - 1.1.1.1
            - 192.168.178.1
            - fd00::cece:1eff:fe8c:1973
            - 192.168.178.1
            - fd00::cece:1eff:fe8c:1973
            - 1.1.1.1
    install:
        diskSelector:
            model: NGFF 256GB SSD
        image: factory.talos.dev/metal-installer/98c912e25a452279d00bd5f060b0b3f6677ee1546f391928bab5ed1e5bd90bd7:v1.14.6
        wipe: true
    time:
        disabled: false
        servers:
            - 192.168.178.1
            - time.cloudflare.com
    sysctls:
        net.ipv6.conf.all.accept_ra: "0"
        net.ipv6.conf.default.accept_ra: "0"
        net.ipv6.conf.enp87s0.accept_ra: "0"
    # Features describe individual Talos features that can be switched on or off.
    features:
        rbac: true
        stableHostname: true
        apidCheckExtKeyUsage: true
        diskQuotaSupport: true # Enable XFS project quota support for EPHEMERAL partition and user disks.
        kubePrism:
            enabled: true
            port: 7445
        hostDNS:
            enabled: true
            forwardKubeDNSToHost: true
    kernel:
        modules:
            - name: zfs
    nodeLabels:
        vm-host: "true"
        # # Configures the logging system.
        # logging:
        #     # Logging destination.
        #     destinations:
        #         - endpoint: tcp://1.2.3.4:12345 # Where to send logs. Supported protocols are "tcp" and "udp".
        #           format: json_lines # Logs format.
        # logging:
        #     # Logging destination.
        #     destinations:
        #         - endpoint: udp://127.0.0.1:12345 # Where to send logs. Supported protocols are "tcp" and "udp".
        #           format: json_lines # Logs format.
        #           # Extra tags (key-value) pairs to attach to every log message sent.
        #           extraTags:
        #             machine: worker-1
        # # Configures the seccomp profiles for the machine.
        # seccompProfiles:
        #     - name: audit.json # The `name` field is used to provide the file name of the seccomp profile.
        #       # The `value` field is used to provide the seccomp profile.
        #       value:
        #         defaultAction: SCMP_ACT_LOG
    # flannel would otherwise pick the VIP fd00::230 as VXLAN address when
    # the node holds it at start, which breaks IPv6 between pods
    nodeAnnotations:
        flannel.alpha.coreos.com/public-ipv6-overwrite: fd00::235
