        key: ENC[AES256_GCM,data:,iv:3hxxkNRfsMWXCF4rdsK/dNfeCpJeYlzbwPXS6iLfsAA=,tag:LwGbl8ZB6kRKI0+K77deyA==,type:str]
    aggregatorCA:
        crt: 
        key: ENC[AES256_GCM,data:,iv:BBaL6bVz8DhWymWn+cfTGPxp3pVtTuautvQcfSAeS78=,tag:W+Y8x+jf1sqc5CyfbJVC2A==,type:str]
    serviceAccount:
        key: ENC[AES256_GCM,data:,iv:VozKI84bsc33A2yHfssM77tvQdTf4z3Pn6ySSQGts68=,tag:7qH4OnlkQyWX3bqEv7DUow==,type:str]
    apiServer:
        image: registry.k8s.io/kube-apiserver:v1.37.2
        certSANs:
            - 192.168.178.230
            - fd00::230
        disablePodSecurityPolicy: true
        admissionControl:
            - name: PodSecurity
              configuration:
                apiVersion: pod-security.admission.config.k8s.io/v1alpha1
                defaults:
                    audit: restricted
                    audit-version: latest
                    enforce: baseline
                    enforce-version: latest
                    warn: restricted
                    warn-version: latest
                exemptions:
                    namespaces:
                        - kube-system
                    runtimeClasses: []
                    usernames: []
                kind: PodSecurityConfiguration
        auditPolicy:
            apiVersion: audit.k8s.io/v1
            kind: Policy
            rules:
                - level: Metadata
    controllerManager:
        image: registry.k8s.io/kube-controller-manager:v1.37.2
    proxy:
        image: registry.k8s.io/kube-proxy:v1.37.2
        extraArgs:
            cluster-cidr: 10.244.0.0/16,fd00:10:244::/48
    scheduler:
        image: registry.k8s.io/kube-scheduler:v1.37.2
    discovery:
        enabled: true
        registries:
            kubernetes:
                disabled: true
            service: {}
    # Etcd specific configuration options.
