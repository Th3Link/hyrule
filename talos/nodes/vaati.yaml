        key: ENC[AES256_GCM,data:,iv:dInVx8wrzkI4Ut7TnRHtow0gwcy3qoSREHGlGgSF9AU=,tag:x/7x0qrBLq7y3Hb7wRuKZg==,type:str]
    aggregatorCA:
        crt: 
        key: ENC[AES256_GCM,data:,iv:K1tQts4jYtFC15mD2qHFksu/mBxoV1n43UQbewhemDE=,tag:UoczzSslIf41m3ZIH2RPAA==,type:str]
    serviceAccount:
        key: ENC[AES256_GCM,data:,iv:/P5b451CB3ACqQSt0L+QuIAsbM1FmhApIJBNgCbkO2E=,tag:0eURgPNtO0gPuPxz1fwasg==,type:str]
    apiServer:
        image: registry.k8s.io/kube-apiserver:v1.37.2
        certSANs:
            - 192.168.178.230
            - fd00::230
        disablePodSecurityPolicy: true
        admissionControl:
            - name: PodSecurity
              configuration:
                apiVersion: pod-security.admission.config.k8s.io/v1alpha1
                defaults:
                    audit: restricted
                    audit-version: latest
                    enforce: baseline
                    enforce-version: latest
                    warn: restricted
                    warn-version: latest
                exemptions:
                    namespaces:
                        - kube-system
                    runtimeClasses: []
                    usernames: []
                kind: PodSecurityConfiguration
        auditPolicy:
            apiVersion: audit.k8s.io/v1
            kind: Policy
            rules:
                - level: Metadata
    controllerManager:
        image: registry.k8s.io/kube-controller-manager:v1.37.2
    proxy:
        image: registry.k8s.io/kube-proxy:v1.37.2
        extraArgs:
            cluster-cidr: 10.244.0.0/16,fd00:10:244::/48
    scheduler:
        image: registry.k8s.io/kube-scheduler:v1.37.2
    discovery:
        enabled: true
        registries:
            kubernetes:
                disabled: true
            service: {}
