    controlPlane:
        endpoint: https://[fd00::230]:6443 # Endpoint represents the endpoint URL parsed out of the machine config.
    clusterName: hyrule
    network:
        cni:
            name: flannel
        dnsDomain: hyrule.luehr.dev
        podSubnets:
            - 10.244.0.0/16
            - fd01:10:244::/48
        serviceSubnets:
            - 10.96.0.0/12
            - fd01:10:96::/112
    token: ENC[AES256_GCM,data:X+0AQiwRgqMPuWImH68TYJAKLR2okPA=,iv:he1ICzJeKklX2oBArv6lIPSZ5miYGArfQxJOKgKgOxM=,tag:d74bJyTPJzWjcARI1HHgOg==,type:str] # The [bootstrap token](https://kubernetes.io/docs/reference/access-authn-authz/bootstrap-tokens/) used to join the cluster.
    secretboxEncryptionSecret: ENC[AES256_GCM,data:5NjDa9n/hVpdtTLUHkcoEp6hBgsJp/GvVv+JjVQ7f3DIUvAoTITyPYJiD3k=,iv:9jQOvR++WPAP5XKPQwnhMBwl2Oeqz2RKGnNnRTXBjY0=,tag:CtGLjQraOLd0VZZRXtWlxg==,type:str]
    ca:
