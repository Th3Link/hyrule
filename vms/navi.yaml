---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: navi
spec:
  runStrategy: Always
  dataVolumeTemplates:
    - metadata:
        name: navi-root
        labels:
          # daily snapshot-cleanup + filesystem-trim (infrastructure/configs/longhorn-backup.yaml)
          recurring-job.longhorn.io/source: enabled
          recurring-job-group.longhorn.io/vm: enabled
      spec:
        storage:
          storageClassName: longhorn-vm
          resources:
            requests:
              storage: 200Gi
        source:
          pvc:
            namespace: vms
            name: arch-golden
  template:
    metadata:
      labels:
        vm: navi
        vm-size: large
    spec:
      # One large VM per node
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  vm-size: large
              topologyKey: kubernetes.io/hostname
      domain:
        cpu:
          cores: 6
        memory:
          guest: 16Gi
        devices:
          disks:
            - name: root
              disk: { bus: virtio }
            - name: cloudinit
              disk: { bus: virtio }
          interfaces:
            - name: default
              masquerade: {}
              # fixed MAC: cloud-init binds the guest network config to it
              macAddress: "02:4b:56:00:00:01"
      networks:
        - name: default
          pod: {}
      volumes:
        - name: root
          dataVolume:
            name: navi-root
        - name: cloudinit
          cloudInitNoCloud:
            secretRef:
              name: agent-cloudinit
