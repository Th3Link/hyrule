# SSH into the agent VMs on a fixed LAN IP (MetalLB)
---
apiVersion: v1
kind: Service
metadata:
  name: navi-ssh
  annotations:
    metallb.io/loadBalancerIPs: 192.168.178.221
spec:
  type: LoadBalancer
  selector:
    vm.kubevirt.io/name: navi
  ports:
    - name: ssh
      port: 22
      targetPort: 22
---
