---
# Shared cloud-init for all agent VMs. Hostname is taken from the VM name.
# If you add tokens here, encrypt this file with sops!
apiVersion: v1
kind: Secret
metadata:
  name: agent-cloudinit
type: Opaque
stringData:
  userdata: |
    #cloud-config
    users:
      - name: marc
        sudo: ALL=(ALL) NOPASSWD:ALL
        shell: /bin/bash
        ssh_authorized_keys:
          - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHMhqgRbcaB/sGn9nbfZg/EKx2ncw5mGHFxLFSelZhHt marc@luehr.dev

    growpart:
      mode: auto

    write_files:
      # Match eth0 by name, not by MAC (sorts before cloud-init's 10-cloud-init-eth0.network)
      - path: /etc/systemd/network/05-eth0.network
        content: |
          [Match]
          Name=eth0

          [Network]
          DHCP=yes

      # No GPU in the VM: keep WebKitGTK on software rendering
      - path: /etc/profile.d/webkit.sh
        content: |
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          export WEBKIT_DISABLE_DMABUF_RENDERER=1

      # User tool dirs (claude, cargo installs) on PATH for login shells ...
      - path: /etc/profile.d/user-bin.sh
        content: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"

      # ... and for systemd user services (claude-rc and the sessions it spawns)
      - path: /etc/environment.d/10-user-bin.conf
        content: |
          PATH=$HOME/.local/bin:$HOME/.cargo/bin:$PATH

      # Claude Code Remote Control as a user service. Installed but NOT enabled:
      # log in once with `claude` + `/login`, run `claude` in ~/work to accept
      # the trust dialog and `claude remote-control` to enable it, then:
      #   systemctl --user enable --now claude-rc && sudo loginctl enable-linger marc
      - path: /home/marc/.config/systemd/user/claude-rc.service
        owner: marc:marc
        defer: true
        content: |
          [Unit]
          Description=Claude Code Remote Control
          After=network-online.target

          [Service]
          WorkingDirectory=%h/work
          ExecStart=%h/.local/bin/claude remote-control --name %H --spawn same-dir
          Restart=on-failure
          RestartSec=15

          [Install]
          WantedBy=default.target

    runcmd:
      # Base system and toolchain
      - pacman-key --init
      - pacman-key --populate archlinux
      - >-
        pacman -Syu --noconfirm --needed
        git github-cli base-devel tmux ripgrep jq
        rustup cargo-nextest nodejs npm
        webkit2gtk-4.1 gtk3 libappindicator-gtk3 librsvg
        xorg-server-xvfb xdotool imagemagick x11vnc
      - su - marc -c 'rustup default stable'
      - su - marc -c 'cargo install tauri-driver --locked'
      - su - marc -c 'cargo install --locked --git https://github.com/styler-ai/ProjectAtlas --tag v0.4.5 projectatlas-cli'
      # Claude Code via the official installer (lands in ~/.local/bin)
      - su - marc -c 'curl -fsSL https://claude.ai/install.sh | bash'
      - su - marc -c 'mkdir -p ~/work'
      # ProjectAtlas MCP for all sessions; uses the .projectatlas/ of the repo it runs in
      - su - marc -c '~/.local/bin/claude mcp add --scope user projectatlas -- ~/.cargo/bin/projectatlas mcp --nearest-project'
      - chown -R marc:marc /home/marc/.config
