---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: midna
spec:
  runStrategy: Always
  dataVolumeTemplates:
    - metadata:
        name: midna-root
      spec:
        storage:
          storageClassName: longhorn-vm
          resources:
            requests:
              storage: 200Gi
        source:
          pvc:
            namespace: vms
            name: arch-golden
  template:
    metadata:
      labels:
        vm: midna
        vm-size: large
    spec:
      # One large VM per node
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  vm-size: large
              topologyKey: kubernetes.io/hostname
      domain:
        cpu:
          cores: 6
        memory:
          guest: 20Gi
        devices:
          disks:
            - name: root
              disk: { bus: virtio }
            - name: cloudinit
              disk: { bus: virtio }
          interfaces:
            - name: default
              masquerade: {}
              # fixed MAC: cloud-init binds the guest network config to it
              macAddress: "6e:a9:ed:9f:b5:f0"
      networks:
        - name: default
          pod: {}
      volumes:
        - name: root
          dataVolume:
            name: midna-root
        - name: cloudinit
          cloudInitNoCloud:
            secretRef:
              name: agent-cloudinit
